name: Integration Test
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target CIDR'
        required: true
        default: '157.90.0.0/16'

jobs:
  test_endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y masscan
          python3 -m pip install --quiet requests || true

      - name: Run Network Probes
        run: |
          set -u
          TARGET="${{ github.event.inputs.target }}"
          echo "probing ${TARGET}"
          sudo masscan -p80,443,8000,8080,8088,8888 "${TARGET}" \
            --rate 15000 --wait 3 -oJ hits.json || true
          if [ -s hits.json ]; then
            echo "hits file present: $(wc -c < hits.json) bytes"
          else
            echo "[]" > hits.json
            echo "no hits"
          fi
          python3 probe_targets.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: |
            results.txt
            hits.json
          if-no-files-found: warn
