name: Integration Test
on:
  workflow_dispatch:

jobs:
  test_endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout & Setup
        uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y masscan
          pip install aiohttp requests

      - name: Run Network Probes
        run: |
          sudo masscan -p80,443,8000,8080,8088,8888 157.90.0.0/16 --rate 15000 -oJ hits.json || true
          python3 probe_targets.py

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: results.txt
