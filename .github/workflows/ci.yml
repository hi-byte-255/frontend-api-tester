name: Integration Test
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target CIDR'
        required: true
        default: '157.90.0.0/16'

jobs:
  app_ports:
    name: API surface check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y masscan

      - name: Stage 1 - scan application ports
        run: |
          set -u
          sudo masscan -p8080,8000,8888,8088,8001,8002,8090 \
            "${{ github.event.inputs.target }}" \
            --rate 15000 --wait 3 -oJ hits.json || true
          [ -s hits.json ] || echo "[]" > hits.json
          echo "hits bytes: $(wc -c < hits.json)"

      - name: Stage 2 - stalled-probe candidates
        run: |
          set -u
          python3 probe_targets.py --hits hits.json --mode app \
            --out app_results.txt --workers 192 --budget 420 || true
          echo "probed: $(wc -l < app_results.txt 2>/dev/null || echo 0)"

      - name: Stage 3+4 - version gate and vuln signal test
        run: |
          set -u
          python3 php_verify.py --in app_results.txt \
            --stage3 app_php_candidates.jsonl \
            --stage4 app_vuln_signals.jsonl \
            --workers 128 --timeout 4 --budget 600 || true
          echo "php rows: $(wc -l < app_php_candidates.jsonl 2>/dev/null || echo 0)"
          echo "signal rows: $(wc -l < app_vuln_signals.jsonl 2>/dev/null || echo 0)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-surface
          path: |
            app_results.txt
            app_php_candidates.jsonl
            app_vuln_signals.jsonl
            hits.json
          if-no-files-found: warn

  web_ports:
    name: Web surface check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y masscan

      - name: Stage 1 - scan web ports
        run: |
          set -u
          sudo masscan -p80,443 \
            "${{ github.event.inputs.target }}" \
            --rate 15000 --wait 3 -oJ hits.json || true
          [ -s hits.json ] || echo "[]" > hits.json
          echo "hits bytes: $(wc -c < hits.json)"

      - name: Stage 2 - PHP prefilter and stalled probe
        run: |
          set -u
          : > web_results.txt
          python3 probe_targets.py --hits hits.json --mode web \
            --out web_results.txt --workers 192 --budget 480 || true
          [ -s web_results.txt ] || echo "# no rows" >> web_results.txt
          echo "probed: $(wc -l < web_results.txt 2>/dev/null || echo 0)"

      - name: Stage 3+4 - version gate and vuln signal test
        run: |
          set -u
          : > web_php_candidates.jsonl
          : > web_vuln_signals.jsonl
          python3 php_verify.py --in web_results.txt \
            --stage3 web_php_candidates.jsonl \
            --stage4 web_vuln_signals.jsonl \
            --workers 128 --timeout 4 --budget 480 || true
          echo "php rows: $(wc -l < web_php_candidates.jsonl 2>/dev/null || echo 0)"
          echo "signal rows: $(wc -l < web_vuln_signals.jsonl 2>/dev/null || echo 0)"

      - name: Stage 4 v2 - differential OOM trigger with paired controls
        run: |
          set -u
          : > web_diff_signals.jsonl
          python3 php_verify2.py \
            --cands web_php_candidates.jsonl \
            --out web_diff_signals.jsonl \
            --workers 48 --timeout 6 --stall 1.6 \
            --pressure-mb 24 --chunk-kb 512 --budget 420 || true
          echo "diff signals: $(wc -l < web_diff_signals.jsonl 2>/dev/null || echo 0)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-surface
          path: |
            web_results.txt
            web_php_candidates.jsonl
            web_vuln_signals.jsonl
            web_diff_signals.jsonl
            hits.json
          if-no-files-found: warn
